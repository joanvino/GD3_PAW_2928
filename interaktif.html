<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Interaktif</title>
</head>

<body>
    <h1 id="judulHalaman">Halaman Interaktif</h1>
    <p id="teks">Teks ini bisa berubah!</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>
    <input type="text" id="inputNama" placeholder="Masukkan nama">
    <button onclick="tampilkanNama()">Tampilkan</button>

    <br><br>
    <h3>Hitung Kuadrat</h3>
    <input type="number" id="inputAngka" placeholder="Masukkan angka">
    <button onclick="hitungKuadrat()">Hitung Kuadrat</button>

    <p id="hasilKuadrat"></p>

    <script>
        const judul = document.getElementById("judulHalaman");
        judul.style.color = "red";
        console.log(judul.innerHTML);
        
        function sapa(nama) {
            return "Halo, " + nama + "!";
        }
        console.log(sapa("Joan"));

        function ubahBiru() {
            const teks = document.getElementById("teks");
            teks.style.color = "blue";
        }

        function tampilkanNama() {
            const nama = document.getElementById("inputNama").value;

            if (nama === "") {
                alert("Silakan isi nama dulu.");
            } else {
                alert("Halo, " + nama + "!");
            }
        }

        function hitungKuadrat() {
            const angka = document.getElementById("inputAngka").value;
            const hasil = angka * angka;

            document.getElementById("hasilKuadrat").innerHTML = "Hasil kuadrat: " + hasil;
        }

        function konfirmasiKembali() {
            return confirm("Apakah Anda yakin ingin kembali?");
        }
    </script>
    <a href="profil.html" onclick="return konfirmasiKembali()">
        Kembali ke halaman profil
    </a>
    <br>
    <a href="form.html" onclick="return konfirmasiKembali()">
        Kembali ke halaman form
    </a>
</body>
</html>
