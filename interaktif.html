<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Interaktif</title>
</head>

<body>
    <h1 id="judulHalaman">Halaman Interaktif</h1>
    <p id="teks">Teks ini bisa berubah!</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>
    <input type="text" id="inputNama" placeholder="Masukkan nama">
    <button onclick="tampilkanNama()">Tampilkan</button>

    <script>
        const judul = document.getElementById("judulHalaman");
        judul.style.color = "red";
        console.log(judul.innerHTML);
        
        function sapa(nama) {
            return "Halo, " + nama + "!";
        }
        console.log(sapa("Joan"));

        function ubahBiru() {
            const teks = document.getElementById("teks");
            teks.style.color = "blue";
        }

        function tampilkanNama() {
            const nama = document.getElementById("inputNama").value;

            if (nama === "") {
                alert("Silakan isi nama dulu.");
            } else {
                alert("Halo, " + nama + "!");
            }
        }
    </script>
    <a href="profil.html">ke halaman profil</a>
    <a href="form.html">ke halaman interaktif</a>

</body>
</html>
